# Production-shaped stack. Not loaded automatically.
#   docker compose -f compose.prod.yaml up -d --build
#
# Set real passwords and APP_KEY in .env first. Do not seed the demo users
# on a shared server. Run `docker compose -f compose.prod.yaml exec app php artisan migrate --force`.

name: aruna-inventory

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: aruna-inventory:prod
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: aruna-inventory:web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventory}
      MYSQL_USER: ${DB_USERNAME:-inventory}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
